<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Start Screen Streaming</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: #08111f;
        color: #e2e8f0;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at top, #10213c, #08111f 68%);
      }
      body.streaming {
        background: rgba(8, 17, 31, 0.92);
      }
      .shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 20px;
      }
      body.streaming .shell {
        min-height: auto;
        padding: 10px;
      }
      .card {
        width: min(100%, 380px);
        display: flex;
        flex-direction: column;
        gap: 18px;
        padding: 22px;
        border-radius: 22px;
        background: rgba(8, 17, 31, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.18);
        box-shadow: 0 24px 70px rgba(2, 6, 23, 0.45);
      }
      body.streaming .card {
        width: min(100%, 220px);
        gap: 0;
        padding: 10px;
        border-radius: 16px;
        background: rgba(8, 17, 31, 0.96);
        box-shadow: 0 14px 34px rgba(2, 6, 23, 0.34);
      }
      button {
        border: 1px solid rgba(148, 163, 184, 0.28);
        background: rgba(30, 41, 59, 0.82);
        color: #e2e8f0;
        border-radius: 10px;
        padding: 8px 14px;
        font: inherit;
        cursor: pointer;
      }
      button:hover {
        filter: brightness(1.08);
      }
      .primary {
        background: linear-gradient(135deg, #0f766e, #0ea5e9);
        border-color: rgba(14, 165, 233, 0.42);
        color: #f8fafc;
      }
      .title {
        display: grid;
        gap: 6px;
      }
      body.streaming .title {
        display: none;
      }
      .title strong {
        font-size: 19px;
      }
      .title span {
        font-size: 13px;
        line-height: 1.45;
        color: #94a3b8;
      }
      .status {
        min-height: 38px;
        color: #bfdbfe;
        font-size: 13px;
        line-height: 1.45;
      }
      body.streaming .status {
        display: none;
      }
      .actions {
        display: flex;
        gap: 10px;
      }
      .actions button {
        flex: 1;
      }
      body.streaming .actions {
        gap: 0;
      }
      body.streaming #start-button {
        display: none;
      }
      body.streaming #stop-button {
        flex: 1 1 auto;
        padding: 10px 16px;
      }
      video {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="card">
        <div class="title">
          <strong>Start Screen Streaming</strong>
          <span>Use this browser prompt to approve the picker. The live view is sent to the Python desktop app, not shown here.</span>
        </div>
        <div class="status" id="status">Waiting for a screen share session...</div>
        <div class="actions">
          <button id="start-button" class="primary" type="button">Start Streaming</button>
          <button id="stop-button" type="button">Stop</button>
        </div>
        <video id="preview" autoplay playsinline muted></video>
      </div>
    </div>
    <script type="module" src="./screen-share.js"></script>
  </body>
</html>
